<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hangman Game</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎮 Hangman Game</h1>

        <p class="subtitle">
            Guess the hidden word!
        </p>

        <div id="hangman">
            🪢
        </div>

        <div id="word">
            _ _ _ _ _
        </div>

        <p>
            Wrong Attempts:
            <span id="wrong">0</span> / 6
        </p>

        <div id="letters"></div>

        <p id="message"></p>

        <button id="newGame">
            New Game
        </button>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
